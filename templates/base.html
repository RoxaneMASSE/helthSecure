<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}HealthSecure{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #1a1a2e; }
        nav { background: #16213e; color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: #a8dadc; text-decoration: none; margin-left: 1.5rem; }
        nav a:hover { color: white; }
        .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
        .card { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 1.5rem; }
        .badge-doctor  { background: #d4edff; color: #0055aa; padding: .2rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 600; }
        .badge-patient { background: #d4f7e0; color: #1a7a3c; padding: .2rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 600; }
        .btn { display: inline-block; padding: .6rem 1.4rem; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: .9rem; cursor: pointer; border: none; }
        .btn-primary { background: #457b9d; color: white; }
        .btn-danger  { background: #e63946; color: white; }
    </style>
</head>
<body>
<nav>
    <span style="font-size:1.1rem;font-weight:700;">🏥 HealthSecure</span>
    <div>
        {% if user.is_authenticated %}
            <a href="{% url 'accounts:profil' %}">My profile</a>
            <a href="{% url 'oidc_logout' %}">Log out</a>
        {% else %}
            <a href="{% url 'accounts:register' %}">Register</a>
            <a href="{% url 'oidc_authentication_init' %}">Log in</a>
        {% endif %}
    </div>
</nav>
<div class="container">
    {% block content %}{% endblock %}
</div>
</body>
</html>
