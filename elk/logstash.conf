# Pipeline Logstash - réception des logs de sécurité Django
#
# Input : les handlers Django (healthproject/settings.py) envoient des logs
# JSON en TCP directement vers logstash:5000 (python-logstash, format logstash v1).
#
# Filter :
#   1. Parsing du message "EVENT_TYPE key=val key=val ..." en champs structurés
#      (event_type, user, username, ip, file_id, ...) via grok + kv.
#   2. Détection d'anomalies par seuils (rate-based) via le filtre aggregate :
#      - sondage IDOR (5 accès refusés / même user en 5 min)
#      - exfiltration massive (10 FILE_DOWNLOAD / même user en 2 min)
#      Les événements suspects sont tagués "anomaly".
#
#      Pas de règle sur LOGIN_FAILED : l'authentification est entièrement
#      déléguée à la page Keycloak (accounts/backends.py), Django ne voit
#      jamais un mot de passe erroné, donc ce log ne se produit jamais dans
#      les faits. Le brute force sur le login est géré côté Keycloak
#      (bruteForceProtected, realm-export.json), hors de ce pipeline.
#
# Output : Elasticsearch, index quotidien "django-logs-YYYY.MM.dd", et les
# événements tagués "anomaly" sont dupliqués dans "security-alerts-YYYY.MM.dd"
# pour être faciles à cibler dans un dashboard/règle d'alerte Kibana.
#
# NB: le filtre "aggregate" garde son état en mémoire par worker Logstash.
# Il faut donc pipeline.workers=1 (voir docker-compose.elk.yml,
# PIPELINE_WORKERS=1) sinon les compteurs sont faux car répartis sur
# plusieurs threads.

input {
  tcp {
    port => 5000
    codec => json_lines
  }
}

filter {
  # python-logstash (format v1) met déjà le message applicatif dans "message"
  # et les infos structurées dans des champs séparés (host, level, logger_name...).
  # On ajoute juste un champ explicite pour filtrer facilement dans Kibana.
  if [logger_name] {
    mutate {
      add_field => { "app" => "healthsecure" }
    }
  }

  # Ne structure que les logs applicatifs "EVENT_TYPE key=val ..." émis par
  # le logger "security" (accounts/signals.py, accounts/decorators.py,
  # core/views.py). Les autres logs (django, exceptions...) passent tels quels.
  if [logger_name] == "security" {
    grok {
      match => { "message" => "^%{WORD:event_type}(?: %{GREEDYDATA:kv_pairs})?$" }
      tag_on_failure => ["_event_parse_failure"]
    }
    if [kv_pairs] {
      kv {
        source => "kv_pairs"
        field_split => " "
        remove_field => ["kv_pairs"]
      }
    }

    # Sondage IDOR : accès refusés répétés pour le même utilisateur
    if [event_type] in ["ACCESS_DENIED", "FILE_ACCESS_DENIED", "PATIENT_FILES_ACCESS_DENIED", "FILE_UPLOAD_BY_DOCTOR_DENIED", "FILE_DELETION_REQUEST_DENIED", "FILE_MODIFICATION_REQUEST_DENIED"] {
      # NB: task_id préfixé "denied-" pour rester un pattern distinct de celui
      # du bloc FILE_DOWNLOAD ci-dessous : le plugin aggregate refuse deux
      # filtres partageant le même pattern task_id avec des timeout différents.
      aggregate {
        task_id => "denied-%{user}"
        code => "
          map['count'] ||= 0
          map['count'] += 1
          event.set('denied_count', map['count'])
        "
        timeout => 300
        timeout_tags => ["_aggregatetimeout"]
      }
      if [denied_count] and [denied_count] >= 5 {
        mutate { add_tag => ["anomaly", "idor_probing_suspected"] }
      }
    }

    # Exfiltration massive : téléchargements répétés par le même utilisateur
    if [event_type] == "FILE_DOWNLOAD" {
      aggregate {
        task_id => "download-%{user}"
        code => "
          map['count'] ||= 0
          map['count'] += 1
          event.set('download_count', map['count'])
        "
        timeout => 120
        timeout_tags => ["_aggregatetimeout"]
      }
      if [download_count] and [download_count] >= 10 {
        mutate { add_tag => ["anomaly", "mass_exfiltration_suspected"] }
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "django-logs-%{+YYYY.MM.dd}"
  }

  if "anomaly" in [tags] {
    elasticsearch {
      hosts => ["http://elasticsearch:9200"]
      index => "security-alerts-%{+YYYY.MM.dd}"
    }
  }

  stdout { codec => rubydebug }
}
