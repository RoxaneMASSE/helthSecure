{% extends "base.html" %}
{% load static %}
{% block title %}Login — HealthSecure{% endblock %}

{% block extra_head %}
<script>
    const CSRF_TOKEN = '{{ csrf_token }}';
    const WEBAUTHN_LOGIN_BEGIN_URL    = "{% url 'accounts:webauthn_login_begin' %}";
    const WEBAUTHN_LOGIN_COMPLETE_URL = "{% url 'accounts:webauthn_login_complete' %}";
</script>
<script src="{% static 'accounts/js/webauthn_utils.js' %}"></script>
<script src="{% static 'accounts/js/webauthn_login.js' %}"></script>
{% endblock %}

{% block content %}
<div class="card" style="max-width:440px; margin:0 auto;">
    <h2 style="margin-bottom:1.5rem;">Log in</h2>

    <div id="error-box" style="display:none; background:#fde; padding:.75rem;
         border-radius:8px; margin-bottom:1rem; color:#c00;"></div>

    <div style="margin-bottom:1rem;">
        <label style="display:block; font-weight:600; margin-bottom:.3rem;">
            Email <span style="color:#e63946;">*</span>
        </label>
        <input type="email" id="username" placeholder="your@email.com"
               style="width:100%; padding:.5rem .75rem; border:1px solid #ccc;
                      border-radius:6px; font-size:.95rem; box-sizing:border-box;">
    </div>

    <button id="btn-webauthn" class="btn btn-primary"
            style="width:100%; padding:.75rem; margin-bottom:1rem;">
        🔐 Log in with WebAuthn
    </button>

    <hr style="margin:1.5rem 0; border:none; border-top:1px solid #eee;">

   

    <p style="text-align:center; margin-top:1.5rem; color:#555; font-size:.9rem;">
        No account?
        <a href="{% url 'accounts:register' %}" style="color:#457b9d;">Register</a>
    </p>
</div>
{% endblock %}
