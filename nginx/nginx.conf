events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # ── Bloc routes admin (403 Forbidden) ─────────────────────────────────

        # Bloque /admin et tout sous-chemin
        location ~* ^/admin {
            return 403;
        }

        # Bloque /realms/master et tout sous-chemin
        location ~* ^/realms/master {
            return 403;
        }

        # Bloque les enregistrements de clients
        location ~* /clients-registrations/ {
            return 403;
        }

        # Bloque tout chemin contenant "console" ou "admin-api"
        location ~* (console|admin-api) {
            return 403;
        }

        # ── Routes autorisées → proxy vers Keycloak interne ───────────────────
        # /realms/health/protocol/openid-connect/* (auth, token, userinfo, certs, logout)
        # /realms/health/.well-known/*
        # /realms/health/account/*
        # /js/* et /resources/* (assets pages login)

        location / {
            proxy_pass         http://keycloak:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }
    }
}
