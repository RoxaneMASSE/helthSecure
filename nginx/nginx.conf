events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # ── Admin routes block (403 Forbidden) ─────────────────────────────────

        # Blocks /admin and any sub-path
        location ~* ^/admin {
            return 403;
        }

        # Blocks /realms/master and any sub-path
        location ~* ^/realms/master {
            return 403;
        }

        # Blocks client registrations
        location ~* /clients-registrations/ {
            return 403;
        }

        # Blocks any path containing "console" or "admin-api"
        location ~* (console|admin-api) {
            return 403;
        }

        # ── Allowed routes → proxy to internal Keycloak ───────────────────
        # /realms/health/protocol/openid-connect/* (auth, token, userinfo, certs, logout)
        # /realms/health/.well-known/*
        # /realms/health/account/*
        # /js/* and /resources/* (login page assets)

        location / {
            proxy_pass         http://keycloak:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }
    }
}
