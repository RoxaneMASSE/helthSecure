{% extends "base.html" %}
{% block title %}Patient Dashboard {% endblock %}
{% block content %}
<div class="card">
    <h2>Bonjour {{ user.get_full_name|default:user.username }}
        <span class="badge-patient">Patient</span>
    </h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
    <div class="card">
        <h3>📋 My medical records</h3>
        <p style="color:#888;margin:.5rem 0 1rem;">Check medical files</p>
        <a href="#" class="btn btn-primary">Check medical records</a>
    </div>
    <div class="card">
        <h3>👨‍⚕️ My doctors</h3>
        <p style="color:#888;margin:.5rem 0 1rem;">Managed assigned doctors</p>
        <a href="#" class="btn btn-primary">Manage</a>
    </div>
</div>
{% endblock %}
