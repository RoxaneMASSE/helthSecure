{% extends "base.html" %}
{% block title %}Doctor Dashboard{% endblock %}
{% block content %}
<div class="card">
    <h2>Hello Dr. {{ user.get_full_name|default:user.username }}
        <span class="badge-doctor">Doctor</span>
    </h2>
</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
    <div class="card">
        <h3>👥 My patients</h3>
        <p style="color:#888;margin:.5rem 0 1rem;">Assigned patients</p>
        <a href="#" class="btn btn-primary">Check patients</a>
    </div>
    <div class="card">
        <h3>📁 Medical records</h3>
        <p style="color:#888;margin:.5rem 0 1rem;">Manage medical records</p>
        <a href="#" class="btn btn-primary">Check records</a>
    </div>
</div>
{% endblock %}
